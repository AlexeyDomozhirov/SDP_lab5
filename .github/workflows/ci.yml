name: Python CI with uv

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: uv sync

      - name: Run Python script
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output
          uv run src/sdp_lab3/main.py 2>&1 | tee output/run_log.txt

          {
            printf '<!doctype html><html><head><meta charset="utf-8">'
            printf '<title>CI Log</title></head><body><pre>'
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' output/run_log.txt
            printf '</pre></body></html>'
          } > output/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-project
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
